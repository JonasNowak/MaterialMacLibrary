name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Swift Testing (macOS 15)
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build (Debug & Release)
        run: |
          swift build
          swift build -c release

      - name: Run Unit Tests
        run: |
          chmod +x scripts/test.sh
          ./scripts/test.sh
